<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mend-A-Bath Staff Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FFED00 0%, #FFD700 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #2C2C2C;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2C2C2C;
            margin-bottom: 8px;
        }

        .input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            background: #F5F5F5;
            color: #2C2C2C;
            transition: border-color 0.3s;
        }

        .input:focus {
            outline: none;
            border-color: #FFED00;
            background: white;
        }

        .button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .button-primary {
            background: #FFED00;
            color: #2C2C2C;
        }

        .button-primary:hover {
            background: #FFD700;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 237, 0, 0.3);
        }

        .button-primary:active {
            transform: translateY(0);
        }

        .button-secondary {
            background: transparent;
            color: #FFED00;
            border: 2px solid #FFED00;
            margin-top: 12px;
        }

        .button-secondary:hover {
            background: rgba(255, 237, 0, 0.1);
        }

        .toggle-text {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 16px;
        }

        .toggle-link {
            color: #FFED00;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #F5F5F5;
            border-left: 4px solid #FFED00;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        .error {
            background: #FEE2E2;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            border-left: 4px solid #DC2626;
        }

        .success {
            background: #DCFCE7;
            color: #16A34A;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            border-left: 4px solid #16A34A;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .portal-header {
            background: linear-gradient(135deg, #FFED00 0%, #FFD700 100%);
            padding: 20px;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .portal-header h1 {
            font-size: 28px;
            color: #2C2C2C;
        }

        .logout-btn {
            background: #2C2C2C;
            color: #FFED00;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #1a1a1a;
        }

        .user-email {
            font-size: 12px;
            color: #2C2C2C;
            margin-top: 4px;
        }

        .portal-content {
            display: none;
        }

        .portal-content.active {
            display: block;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            background: #FFED00;
            color: #2C2C2C;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .resource-link {
            background: #F5F5F5;
            border: 1px solid #E5E7EB;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .resource-link:hover {
            background: white;
            border-color: #FFED00;
            transform: translateX(4px);
        }

        .resource-icon {
            font-size: 32px;
        }

        .resource-info {
            flex: 1;
        }

        .resource-title {
            font-weight: 600;
            color: #2C2C2C;
            font-size: 16px;
        }

        .resource-desc {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .resource-arrow {
            color: #999;
            font-size: 18px;
        }

        .admin-section {
            background: #F5F5F5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 2px solid #FFED00;
        }

        .admin-title {
            font-size: 18px;
            font-weight: 600;
            color: #2C2C2C;
            margin-bottom: 16px;
        }

        .admin-badge {
            display: inline-block;
            background: #FFED00;
            color: #2C2C2C;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 8px;
        }

        .employee-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #E5E7EB;
        }

        .employee-email {
            font-weight: 600;
            color: #2C2C2C;
        }

        .employee-info {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .employee-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .employee-actions button {
            flex: 1;
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-remove {
            background: #FEE2E2;
            color: #DC2626;
        }

        .btn-remove:hover {
            background: #FCA5A5;
        }

        .btn-reset {
            background: #DBEAFE;
            color: #0284C7;
        }

        .btn-reset:hover {
            background: #BAE6FD;
        }

        .admin-toggle {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #E5E7EB;
        }

        .admin-toggle-link {
            color: #666;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .admin-toggle-link:hover {
            color: #2C2C2C;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px;
            }

            .title {
                font-size: 24px;
            }

            .portal-header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .portal-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login/Register Form -->
        <div id="authForm" class="card">
            <div class="header">
                <div class="logo">🔐</div>
                <h1 class="title">Staff Portal</h1>
                <p class="subtitle" id="authSubtitle">Login to continue</p>
            </div>

            <div id="errorMessage" class="error hidden"></div>
            <div id="successMessage" class="success hidden"></div>

            <form id="form" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label class="label">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="input" 
                        placeholder="your.email@mendabath.co.uk"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="label">PIN (4 digits)</label>
                    <input 
                        type="password" 
                        id="pin" 
                        class="input" 
                        placeholder="0000"
                        maxlength="4"
                        inputmode="numeric"
                        required
                    >
                </div>

                <div class="form-group hidden" id="confirmPinGroup">
                    <label class="label">Confirm PIN</label>
                    <input 
                        type="password" 
                        id="confirmPin" 
                        class="input" 
                        placeholder="0000"
                        maxlength="4"
                        inputmode="numeric"
                    >
                </div>

                <button type="submit" class="button button-primary" id="submitBtn">Login</button>
            </form>

            <div class="toggle-text">
                <span id="toggleText">New here?</span>
                <a class="toggle-link" onclick="toggleMode()">Create Account</a>
            </div>

            <div class="info-box" id="infoBox">
                • Must be exactly 4 digits<br>
                • You set your own PIN on first login<br>
                • Keep it secure and don't share
            </div>
        </div>

        <!-- Staff Portal -->
        <div id="portal" class="portal-content">
            <div class="card">
                <div class="portal-header">
                    <div>
                        <h1>Staff Portal</h1>
                        <div class="user-email" id="userEmail"></div>
                    </div>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>

                <div id="portalContent"></div>

                <!-- Admin Panel (Only visible to admin) -->
                <div id="adminPanel" class="admin-section hidden">
                    <div>
                        <div class="admin-title">Admin Panel <span class="admin-badge">ADMIN ONLY</span></div>
                        
                        <div class="form-group">
                            <label class="label">Add New Employee</label>
                            <input 
                                type="email" 
                                id="newEmployeeEmail" 
                                class="input" 
                                placeholder="employee@mendabath.co.uk"
                            >
                            <button type="button" class="button button-primary" onclick="addEmployee()" style="margin-top: 8px;">
                                Add Employee
                            </button>
                        </div>

                        <div class="admin-title" style="margin-top: 20px; margin-bottom: 12px; font-size: 16px;">Staff Members (<span id="employeeCount">0</span>)</div>
                        <div id="employeeList"></div>
                    </div>
                </div>

                <!-- Admin Toggle (Hidden by default) -->
                <div class="admin-toggle">
                    <a class="admin-toggle-link" onclick="toggleAdminPanel()">Admin Access</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let currentUser = null;
        let employees = [];
        let showAdminPanel = false;

        // ADMIN PIN - CHANGE THIS TO YOUR PREFERRED PIN
        const ADMIN_PIN = "9999";

        // Initialize
        function init() {
            loadFromStorage();
            if (currentUser) {
                showPortal();
            } else {
                showAuth();
            }
        }

        // Storage Management
        function saveToStorage() {
            localStorage.setItem('staffPortalEmployees', JSON.stringify(employees));
            if (currentUser) {
                localStorage.setItem('staffPortalCurrentUser', JSON.stringify(currentUser));
            }
        }

        function loadFromStorage() {
            const stored = localStorage.getItem('staffPortalEmployees');
            if (stored) {
                employees = JSON.parse(stored);
            }

            const user = localStorage.getItem('staffPortalCurrentUser');
            if (user) {
                currentUser = JSON.parse(user);
            }
        }

        // Toggle between login and register
        function toggleMode() {
            isLoginMode = !isLoginMode;
            const form = document.getElementById('form');
            const confirmPinGroup = document.getElementById('confirmPinGroup');
            const submitBtn = document.getElementById('submitBtn');
            const authSubtitle = document.getElementById('authSubtitle');
            const toggleText = document.getElementById('toggleText');

            if (isLoginMode) {
                confirmPinGroup.classList.add('hidden');
                submitBtn.textContent = 'Login';
                authSubtitle.textContent = 'Login to continue';
                toggleText.textContent = 'New here?';
                document.getElementById('pin').value = '';
                document.getElementById('confirmPin').value = '';
            } else {
                confirmPinGroup.classList.remove('hidden');
                submitBtn.textContent = 'Create Account';
                authSubtitle.textContent = 'Create your account';
                toggleText.textContent = 'Already have an account?';
                document.getElementById('pin').value = '';
                document.getElementById('confirmPin').value = '';
            }

            clearMessages();
        }

        // Handle form submission
        function handleSubmit(event) {
            event.preventDefault();
            clearMessages();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const pin = document.getElementById('pin').value.trim();

            if (!email || !pin) {
                showError('Please fill in all fields');
                return;
            }

            if (!/^\d{4}$/.test(pin)) {
                showError('PIN must be exactly 4 digits');
                return;
            }

            if (isLoginMode) {
                handleLogin(email, pin);
            } else {
                handleRegister(email, pin);
            }
        }

        // Login
        function handleLogin(email, pin) {
            const employee = employees.find(e => e.email === email && e.pin === pin);

            if (!employee) {
                showError('Invalid email or PIN');
                return;
            }

            employee.lastLogin = new Date().toISOString();
            currentUser = employee;
            showAdminPanel = false;
            saveToStorage();
            showPortal();
        }

        // Register
        function handleRegister(email, pin) {
            const confirmPin = document.getElementById('confirmPin').value.trim();

            if (pin !== confirmPin) {
                showError('PINs do not match');
                return;
            }

            if (employees.some(e => e.email === email)) {
                showError('Email already exists');
                return;
            }

            if (!email.includes('@')) {
                showError('Please enter a valid email');
                return;
            }

            const newEmployee = {
                id: `emp_${Date.now()}`,
                email,
                pin,
                createdAt: new Date().toISOString(),
                lastLogin: new Date().toISOString()
            };

            employees.push(newEmployee);
            currentUser = newEmployee;
            showAdminPanel = false;
            saveToStorage();
            showSuccess('Account created successfully!');
            setTimeout(() => showPortal(), 1000);
        }

        // Logout
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                currentUser = null;
                showAdminPanel = false;
                localStorage.removeItem('staffPortalCurrentUser');
                isLoginMode = true;
                document.getElementById('email').value = '';
                document.getElementById('pin').value = '';
                document.getElementById('confirmPin').value = '';
                showAuth();
            }
        }

        // Toggle Admin Panel
        function toggleAdminPanel() {
            const adminPin = prompt('Enter Admin PIN:');
            if (adminPin === null) return;

            if (adminPin === ADMIN_PIN) {
                showAdminPanel = !showAdminPanel;
                updateAdminPanelVisibility();
                if (showAdminPanel) {
                    alert('Admin Panel unlocked!');
                } else {
                    alert('Admin Panel locked');
                }
            } else {
                alert('Invalid Admin PIN');
            }
        }

        // Update Admin Panel Visibility
        function updateAdminPanelVisibility() {
            const adminPanel = document.getElementById('adminPanel');
            if (showAdminPanel) {
                adminPanel.classList.remove('hidden');
            } else {
                adminPanel.classList.add('hidden');
            }
        }

        // Add employee (admin)
        function addEmployee() {
            if (!showAdminPanel) {
                alert('Admin access required');
                return;
            }

            const email = document.getElementById('newEmployeeEmail').value.trim().toLowerCase();

            if (!email) {
                alert('Please enter an email');
                return;
            }

            if (!email.includes('@')) {
                alert('Please enter a valid email');
                return;
            }

            if (employees.some(e => e.email === email)) {
                alert('Email already exists');
                return;
            }

            const newEmployee = {
                id: `emp_${Date.now()}`,
                email,
                pin: '',
                createdAt: new Date().toISOString()
            };

            employees.push(newEmployee);
            saveToStorage();
            document.getElementById('newEmployeeEmail').value = '';
            updateEmployeeList();
            alert(`${email} has been added to the staff portal`);
        }

        // Remove employee (admin)
        function removeEmployee(id) {
            if (!showAdminPanel) {
                alert('Admin access required');
                return;
            }

            if (confirm('Are you sure you want to remove this employee?')) {
                employees = employees.filter(e => e.id !== id);
                saveToStorage();
                updateEmployeeList();
            }
        }

        // Reset PIN (admin)
        function resetPin(id) {
            if (!showAdminPanel) {
                alert('Admin access required');
                return;
            }

            const newPin = prompt('Enter new 4-digit PIN:');
            if (newPin === null) return;

            if (!/^\d{4}$/.test(newPin)) {
                alert('PIN must be exactly 4 digits');
                return;
            }

            const employee = employees.find(e => e.id === id);
            if (employee) {
                employee.pin = newPin;
                saveToStorage();
                updateEmployeeList();
                alert('PIN updated successfully');
            }
        }

        // Update employee list
        function updateEmployeeList() {
            const list = document.getElementById('employeeList');
            const count = document.getElementById('employeeCount');

            count.textContent = employees.length;

            if (employees.length === 0) {
                list.innerHTML = '<div style="color: #666; font-size: 14px; text-align: center; padding: 20px;">No employees added yet</div>';
                return;
            }

            list.innerHTML = employees.map(emp => `
                <div class="employee-item">
                    <div class="employee-email">${emp.email}</div>
                    <div class="employee-info">
                        ${emp.pin ? 'PIN set' : 'PIN not set'}
                        ${emp.lastLogin ? ' • Last login: ' + new Date(emp.lastLogin).toLocaleDateString() : ''}
                    </div>
                    <div class="employee-actions">
                        <button class="btn-reset" onclick="resetPin('${emp.id}')">Reset PIN</button>
                        <button class="btn-remove" onclick="removeEmployee('${emp.id}')">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        // Show/Hide UI
        function showAuth() {
            document.getElementById('authForm').style.display = 'block';
            document.getElementById('portal').classList.remove('active');
        }

        function showPortal() {
            document.getElementById('authForm').style.display = 'none';
            document.getElementById('portal').classList.add('active');
            document.getElementById('userEmail').textContent = `Logged in as: ${currentUser.email}`;
            renderPortalContent();
            updateEmployeeList();
            updateAdminPanelVisibility();
        }

        // Render portal content
        function renderPortalContent() {
            const resources = [
                {
                    title: 'Stock Management',
                    items: [
                        { title: 'Stock Order', desc: 'Create and manage stock orders', icon: '📦', url: 'https://mendabathrenew.github.io/Stock-Order/' },
                        { title: 'Stock Take', desc: 'Conduct inventory stock takes', icon: '📊', url: 'https://mendabathrenew.github.io/Mendabath-Stock-Take/' },
                        { title: 'Monthly Maintenance', desc: 'Track monthly maintenance tasks', icon: '🔧', url: 'https://mendabathrenew.github.io/Monthly-Maintenance/' }
                    ]
                },
                {
                    title: 'HR & Safety',
                    items: [
                        { title: 'Bright HR', desc: 'HR management and employee records', icon: '👥', url: 'https://app.brighthr.com/dashboard' },
                        { title: 'Bright Safe', desc: 'Health & safety documentation', icon: '🛡️', url: 'https://app.brightsafe.com/' }
                    ]
                },
                {
                    title: 'Documentation',
                    items: [
                        { title: 'Company SOPs', desc: 'Standard Operating Procedures', icon: '📋', url: 'https://docs.google.com/document/d/1example/edit' },
                        { title: 'Policies & Procedures', desc: 'Company policies and guidelines', icon: '📖', url: 'https://docs.google.com/document/d/1example/edit' }
                    ]
                },
                {
                    title: 'Media & Content',
                    items: [
                        { title: 'Submit Images', desc: 'Upload work photos and documentation', icon: '📸', url: 'https://drive.google.com/drive/folders/14PZPWW7W-o9TYco92HRhXv9uqJsApHHh?usp=sharing' }
                    ]
                }
            ];

            const content = resources.map(section => `
                <div class="section">
                    <div class="section-title">${section.title}</div>
                    ${section.items.map(item => `
                        <a href="${item.url}" target="_blank" class="resource-link">
                            <div class="resource-icon">${item.icon}</div>
                            <div class="resource-info">
                                <div class="resource-title">${item.title}</div>
                                <div class="resource-desc">${item.desc}</div>
                            </div>
                            <div class="resource-arrow">→</div>
                        </a>
                    `).join('')}
                </div>
            `).join('');

            document.getElementById('portalContent').innerHTML = content;
        }

        // Message handlers
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
        }

        function clearMessages() {
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('successMessage').classList.add('hidden');
        }

        // Start app
        init();
    </script>
</body>
</html>
